<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StretchMan - Sign In</title>
    <link rel="stylesheet" href="lg2.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google Sign-In SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="auth-page">
    <div class="auth-wrapper">
        <!-- Logo Header -->
        <div class="brand-header">
            <div class="lightning-icon">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <h1>StretchMan</h1>
            <p>Command your performance.</p>
        </div>

        <!-- Auth Card -->
        <div class="auth-card">
            <form id="auth-form" onsubmit="handleAuth(event)">
                <!-- Email Field -->
                <div class="field-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="agent@stretchman.com" required>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="field-group">
                    <div class="label-row">
                        <label for="password">Password</label>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                        <i class="fa-regular fa-eye-slash toggle-password" id="togglePassword" onclick="togglePasswordVisibility()"></i>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="btn-submit" class="btn-signin">
                    <span id="btn-text">Sign In</span> <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <!-- Divider -->
            <div class="auth-divider">
                <span>OR</span>
            </div>

            <!-- Google Login Container -->
            <div class="google-btn-container">
                <div id="g_id_onload"
                    data-client_id="300181200716-ql4asoqlr5c6kr07bevq8qnnbhjqfom1.apps.googleusercontent.com"
                    data-callback="handleGoogleLogin">
                </div>
                <div class="g_id_signin" 
                    data-type="standard" 
                    data-theme="filled_black" 
                    data-size="large" 
                    data-width="100%">
                </div>
            </div>

            <!-- Footer Switcher -->
            <div class="auth-footer">
                <span id="switch-text">Don't have an account?</span>
                <a href="register.html" id="switch-link">Sign Up</a>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
